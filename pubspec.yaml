name: mr_plankton_icsa
description: "MR.PLANKTON ZUR X-BUILD safe Flutter APK template"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: assets/icon/icon.jpg
  image_path_ios: assets/icon/icon/icon.jpg
  image_path: assets/icon/icon.jpg
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
  fonts:
    - family: Orbitron
      fonts:
        - asset: fonts/Orbitron-Regular.ttf
          weight: 400
        - asset: fonts/Orbitron-Medium.ttf
          weight: 500
        - asset: fonts/Orbitron-SemiBold.ttf
          weight: 600
        - asset: fonts/Orbitron-Bold.ttf
          weight: 700
        - asset: fonts/Orbitron-ExtraBold.ttf
          weight: 800
        - asset: fonts/Orbitron-Black.ttf
          weight: 900
    - family: ShareTechMono
      fonts:
        - asset: fonts/ShareTechMono-Regular.ttf
