name: ZUR X-BUILD APK

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build mode
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          if [ "${{ inputs.build_mode }}" = "debug" ]; then
            flutter build apk --debug
            echo "APK_PATH=build/app/outputs/flutter-apk/app-debug.apk" >> "$GITHUB_ENV"
          else
            flutter build apk --release
            echo "APK_PATH=build/app/outputs/flutter-apk/app-release.apk" >> "$GITHUB_ENV"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mr-plankton-apk-${{ inputs.build_mode }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
